[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stateattention"
version = "0.1.0"
description = "State-space model whose recurrent state attends over its own input, for battery SOH trajectory forecasting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "torch>=2.2",
    "einops>=0.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Optional: fused CUDA kernels. Both need a CUDA toolchain to build.
gpu = [
    "causal-conv1d>=1.4.0",
    "mamba-ssm>=2.2.2",
]
track = ["wandb>=0.17"]
dev = ["pytest>=8.0", "ruff>=0.5", "ipykernel", "jupyter"]

[project.scripts]
mf = "stateattention.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stateattention"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
